
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galo Clicker</title>
    <link rel="stylesheet" href="principal.css">
</head>
<body>
    <header>
        <img class="logo" src="imagens/logo.jpeg">
        <p><img src="imagens/moeda.png" class="moeda"> Moedas: <small id="coin">0</small></p>
        <strong>Multiplicador: 1x</strong>
        <aside class="barra">|</aside>
    </header>
    <div class="container">
        <div class="campo">
            <img src="imagens/estadio1.png">
            <button class="areaclick">
                <img src="imagens/barba.png" alt="barba">
            </button>
            <div class="goleiro">
                <img src="imagens/Fábio Cabisbaixo no Cruzeiro.png">
            </div>
            <div class="zagueiro">
                <img src="imagens/vitao.png">
            </div>
            <div class="meia">
                <img src="imagens/Fred.png">
            </div>
            <div class="atacante">
                <img src="imagens/kingnier.png">
            </div>
        </div>
    </div>
    <h1>UPGRADES</h1>
    <div class="secaodois">
        <section class="estadio">
            <h2>Estadio: Estadio de Várzea lvl 1</h2>
            <p>Estadio <span class="info"><span class="nivel">lvl 1</span><span class="preco"><img src="imagens/moeda.png" class="moedapreco">100</span></span></p>
        </section>
        <section class="multiplicador">
            <h2>Bolas: Multiplicador lvl 1</h2>
            <p>Multiplicador de bolas<span class="info"><span class="nivel">lvl 1</span><span class="preco"><img src="imagens/moeda.png" class="moedapreco">10</span></span></p>
        </section>
        <section class="bolas">
            <h2>Bolas: Fábrica lvl 1</h2>
            <p>Bolas por clique<span class="info"><span class="nivel">lvl 1</span><span class="preco"><img src="imagens/moeda.png" class="moedapreco">80</span></span></p>
        </section>
    </div>
    <footer>
        <p>Galo Clicker</p>
    </footer>
    <script src="principal.js"></script>
</body>
<script src="principal.js"></script>
</html>
